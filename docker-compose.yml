# Local / demo stack: Flask + persisted SQLite volume
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /data/healthchecker.db
    volumes:
      - watchtower-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  watchtower-data:
